databaseChangeLog:
  - changeSet:
      id: 001-create-admin-user
      author: tuncay
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: user_name
                  value: admin
              - column:
                  name: email
                  value: admin@example.com
              - column:
                  name: password
                  value: $2a$10$a5/2pT1CHO0J96x8pDK2Ae9nkQ6yMf8BKfnm7i1VrmdeN5rCVJ6TS
  - changeSet:
      id: 002-assign-admin-role
      author: tuncay
      changes:
        - insert:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  valueComputed: (SELECT id FROM users WHERE email = 'admin@example.com')
              - column:
                  name: roles
                  value: ADMIN
  - changeSet:
      id: 003-create-new-column
      author: tuncay
      changes:
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: description
                  type: varchar(100)
              - column:
                  name: weight
                  type: DOUBLE PRECISION
        - modifyDataType:
            tableName: products
            columnName: price
            newDataType: numeric(19, 2)
  - changeSet:
      id: 004-create-carts-table
      author: tuncay
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
        - addForeignKeyConstraint:
            constraintName: fk_carts_user
            baseTableName: carts
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id


  - changeSet:
      id: 005-create-cart_items-table
      author: tuncay
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: cart_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_cart_items_cart
            baseTableName: cart_items
            baseColumnNames: cart_id
            referencedTableName: carts
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_cart_items_product
            baseTableName: cart_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id

  - changeSet:
      id: 006-create-order-table
      author: tuncay
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: numeric(19,2)
              - column:
                  name: created_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_orders_user
  - changeSet:
      id: 007-create-order_items-table
      author: tuncay
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: numeric(19,2)
        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_order_items_order
        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_order_items_product
















